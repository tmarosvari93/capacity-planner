name: core tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci || npm install
      # Sample data and answer key must match the generator (catches hand edits)
      - run: python3 scripts/generate_sample_data.py && git diff --exit-code public/data fixtures
      - run: npx vitest run --config vitest.config.ts
      - run: npx tsc --noEmit -p tsconfig.core.json
